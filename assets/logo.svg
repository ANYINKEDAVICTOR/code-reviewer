<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Rounded Card Background -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Security Shield -->
  <path d="M128 28L186 50V96C186 132 161 162 128 172C95 162 70 132 70 96V50L128 28Z"
        fill="#0F172A" fill-opacity="0.45" stroke="url(#shieldGrad)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Code Brackets < > -->
  <path d="M104 86L90 100L104 114" fill="none" stroke="#C4B5FD" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M152 86L166 100L152 114" fill="none" stroke="#C4B5FD" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Verification Checkmark -->
  <path d="M113 101L123 111L144 89" fill="none" stroke="#34D399" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Title & Author Name -->
  <text x="128" y="205" text-anchor="middle" fill="#FFFFFF"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="700" letter-spacing="1.8">CODE REVIEWER</text>
  <text x="128" y="229" text-anchor="middle" fill="#A5B4FC"
        font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.4">BY ANYINKEDA VICTOR</text>
</svg>